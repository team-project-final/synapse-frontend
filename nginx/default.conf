server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # k8s 프로브 — gitops base/deployment.yaml의 /healthz (8080)
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Flutter web SPA 라우팅: 실제 파일이 없으면 index.html로 폴백
    location / {
        try_files $uri $uri/ /index.html;
    }
}
